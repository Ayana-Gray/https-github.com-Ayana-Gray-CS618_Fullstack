services:
  blog-database:
    image: mongo
    ports:
      - '27017:27017'

  blog-backend:
    build: backend/
    environment:
      PORT: '3001'
      DATABASE_URL: mongodb://host.docker.internal:27017/blog
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - '3001:3001'
    depends_on:
      - blog-database

  blog-frontend:
    build: .
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - '3000:80'
    depends_on:
      - blog-backend